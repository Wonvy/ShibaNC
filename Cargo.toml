[workspace]
resolver = "2"
members = [
    "crates/shibanc-gcode",
    "crates/shibanc-render",
    "crates/shibanc-cli",
    "crates/shibanc-thumb-win",
    "crates/shibanc-ffi",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ShibaNC Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = { version = "1.18", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck", "serde"] }
memmap2 = "0.9"
rayon = "1.10"
thiserror = "2.0"
log = "0.4"
wgpu = "23.0"
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
